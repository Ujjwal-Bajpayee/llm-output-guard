[metadata]
name = llm-output-guard
description = Validate LLM outputs against schemas with automatic retry and JSON extraction.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Ujjwal Prakash Bajpayee
author_email = ujjwalprakash02@gmail.com
url = https://github.com/Ujjwal-Bajpayee/llm-output-guard
project_urls =
    Documentation = https://Ujjwal-Bajpayee.github.io/llm-output-guard
    Source = https://github.com/Ujjwal-Bajpayee/llm-output-guard
    Bug Tracker = https://github.com/Ujjwal-Bajpayee/llm-output-guard/issues
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
python_requires = >=3.9
package_dir =
    = src
packages = find:
zip_safe = False

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    llm-guard = llm_output_guard.cli.main:main
